name: Build and deploy game demos

on:
  push:
    branches: [main]
    paths:
      - 'saltline_愤怒的小鸟/**'
      - 'saltline_咒语乐团/**'
      - 'saltline-fable-5.2-react/**'
      - 'site/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
      - '.gitmodules'
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    env:
      # 小鸟项目没有 packageManager 字段，CI 显式选版本，不回写项目文件。
      COREPACK_ENABLE_AUTO_PIN: '0'
      COREPACK_DEFAULT_TO_LATEST: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          submodules: false

      - name: Set up Node.js 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Enable Yarn 4
        run: |
          corepack enable
          corepack install --global yarn@4.18.1

      # 各项目保留原有包管理方式，安装不得改写锁文件。
      - name: Build Birds
        working-directory: saltline_愤怒的小鸟
        run: |
          yarn install --immutable
          yarn build

      - name: Build Wildspell
        working-directory: saltline_咒语乐团
        run: |
          npm ci
          npm run build

      - name: Build Saltline React
        working-directory: saltline-fable-5.2-react
        run: |
          yarn install --immutable
          yarn build

      - name: Assemble and validate static site
        run: node scripts/assemble-pages.mjs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
